services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: lingai-fastapi-service:${LINGAI_FASTAPI_TAG:-latest}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LINGAI_FASTAPI_HOST_PORT:-18000}:8000"
    volumes:
      - lingai_fastapi_audio_cache:/app/data/audio_cache
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lingai_fastapi_audio_cache:
